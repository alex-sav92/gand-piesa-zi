name: Deploy Angular App

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Angular app
        run: npm run build -- --base-href="/gand-piesa-zi/"

      - name: Deploy to GitHub Pages
        run: npx angular-cli-ghpages --dir=dist/gand-piesa-zi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}